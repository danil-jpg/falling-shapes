<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14161c" />
    <title>Falling Shapes</title>
  </head>
  <body>
    <main class="app">
      <section class="field-wrap">
        <!-- HTML HUD: shape count and occupied area (values updated by HudView) -->
        <div id="hud" class="hud">
          <div class="hud__item">
            <span class="hud__label">Shapes</span>
            <span class="hud__value" data-hud="count">0</span>
          </div>
          <div class="hud__item">
            <span class="hud__label">Area</span>
            <span class="hud__value" data-hud="area">0 px²</span>
          </div>
        </div>
        <!-- PIXI canvas host -->
        <div id="stage" class="stage"></div>
      </section>
      <!-- HTML +/- controls (values and button states updated by ControlsView) -->
      <footer id="controls" class="controls">
        <div class="control" data-control="spawnRate">
          <div class="control__row">
            <button type="button" class="control__btn" data-step="-1" aria-label="Fewer shapes per second">−</button>
            <output class="control__value" data-value aria-live="polite">1 /s</output>
            <button type="button" class="control__btn" data-step="1" aria-label="More shapes per second">+</button>
          </div>
          <span class="control__label">Shapes per second</span>
        </div>
        <div class="control" data-control="gravity">
          <div class="control__row">
            <button type="button" class="control__btn" data-step="-1" aria-label="Decrease gravity">−</button>
            <output class="control__value" data-value aria-live="polite">300</output>
            <button type="button" class="control__btn" data-step="1" aria-label="Increase gravity">+</button>
          </div>
          <span class="control__label">Gravity, px/s²</span>
        </div>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
