<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14161c" />
    <title>Falling Shapes</title>
  </head>
  <body>
    <main class="app">
      <section class="field-wrap">
        <!-- HTML HUD: shape count and occupied area (values updated by HudView) -->
        <div id="hud" class="hud">
          <div class="hud__item">
            <span class="hud__label">Shapes</span>
            <span class="hud__value" data-hud="count">0</span>
          </div>
          <div class="hud__item">
            <span class="hud__label">Area</span>
            <span class="hud__value" data-hud="area">0 px²</span>
          </div>
        </div>
        <!-- PIXI canvas host -->
        <div id="stage" class="stage"></div>
      </section>
      <!-- Step 7: +/- controls for spawn rate and gravity -->
      <footer id="controls" class="controls"></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
